# Porter application manifest — defines the service that runs this app on
# Porter (porter.run). Values wrapped in ${{...}} are set as env group /
# secret references in the Porter dashboard, never committed here.
#
# Deploy with: porter app apply
# (requires `porter auth login` + `porter project set` / `porter app link`
# to target the right project/cluster first — see README for the one-time
# setup a human needs to do before this file works.)

version: v2
name: letterstory-toolbuilder

build:
  method: docker
  dockerfile: ./Dockerfile
  context: .

env:
  # Plain, non-secret defaults only. The real secrets (ANTHROPIC_API_KEY,
  # CONTEXT_DEV_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY) come from the
  # `letterstory-toolbuilder-secrets` env group attached to this app
  # (see `porter app update --attach-env-groups` / the Porter dashboard) —
  # never written here in plaintext.
  ANTHROPIC_MODEL: claude-sonnet-4-6
  CONTEXT_DEV_BASE_URL: https://api.context.dev/v1
  PORTER_ENVIRONMENT: staging

envGroups:
  - letterstory-toolbuilder-secrets

services:
  - name: web
    type: web
    run: node server.js
    instances: 1
    cpuCores: 0.5
    ramMegabytes: 512
    terminationGracePeriodSeconds: 30
    port: 3000
    domains:
      - name: web-22301-57c6c7ab-4p0z458q.onporter.run
    healthCheck:
      enabled: true
      httpPath: /api/health
    # /api/tools/generate can chain up to three sequential Anthropic calls
    # (HTML build + retry + advisory copy/fidelity checks) and the app itself
    # now budgets the full request for a 300s ingress ceiling
    # (NGINX_GENERATION_ROUTE_BUDGET_MS = 300_000). Keep nginx comfortably
    # above that so app-level budget checks fail first and can return a JSON
    # error/partial result instead of nginx terminating the socket with a bare
    # 504 page.
    ingressAnnotations:
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "330"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "330"
    autoscaling:
      enabled: true
      minInstances: 1
      # Temporary stopgap for durable-tool-store: without Supabase configured,
      # generated tools live in the local fallback store, so multiple pods can
      # return false 404s when polling a tool created on a different instance.
      maxInstances: 1
      targetCPUUtilizationPercentage: 70
    sleep: false
